name: Release builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag matches Cargo.toml
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          expected_tag = f"v{manifest['package']['version']}"
          actual_tag = os.environ["RELEASE_TAG"]

          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Tag {actual_tag!r} does not match Cargo.toml version "
                  f"(expected {expected_tag!r})."
              )

          print(f"Verified release tag {actual_tag}.")
          PY

  build:
    name: Build (${{ matrix.platform }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package Unix binary
        if: runner.os != 'Windows'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          mkdir -p dist
          arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          tar -C target/release -czf "dist/rg-studio-${RELEASE_TAG}-${PLATFORM}-${arch}.tar.gz" rg-studio

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $arch = $env:RUNNER_ARCH.ToLowerInvariant()
          $archive = "rg-studio-$($env:RELEASE_TAG)-windows-$arch.zip"
          Compress-Archive -Path "target\release\rg-studio.exe" -DestinationPath "dist\$archive" -Force

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: rg-studio-${{ github.ref_name }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: rg-studio-${{ github.ref_name }}-*
          path: release
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
